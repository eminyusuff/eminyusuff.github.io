name: Academic Highlight
about: Add a conference, award, grant, talk, publication, or academic milestone to the website
labels: ["academic-highlight"]
title: "[Highlight] "
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - conference
        - talk
        - award
        - grant
        - travel_grant
        - publication
        - news
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date
      description: Use YYYY-MM-DD
      placeholder: "2026-08-28"
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Title
      placeholder: "IFAC World Congress 2026"
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Location
      placeholder: "Busan, South Korea"
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Short public-facing description
      placeholder: "Presented our work on ..."
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Public URL
      description: Conference, award, DOI, announcement, or project link
  - type: textarea
    id: photo
    attributes:
      label: Photo
      description: Drag and drop a photo here, or paste a public image URL. The image can be copied into assets/events before publication.
  - type: checkboxes
    id: approval
    attributes:
      label: Publication approval
      options:
        - label: I confirm this information may be published on my academic website.
          required: true
