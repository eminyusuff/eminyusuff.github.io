name: Sync academic site

on:
  push:
    branches: [main]
    paths:
      - 'data/highlights.json'
      - 'data/apple_inbox.json'
      - 'scripts/sync_highlights.py'
      - '.github/workflows/sync-academic-site.yml'
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build academic highlights and News section
        run: python scripts/sync_highlights.py

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/highlights.generated.json index.html
          git commit -m "chore: sync academic highlights"
          git push
